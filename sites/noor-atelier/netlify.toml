# Noor Atelier — static site, no build step.
#
# Deploying from Git:  set the site's base directory to `sites/noor-atelier`
#                      and Netlify reads this file from there.
# Deploying from CLI:  run `netlify deploy --prod` from this directory.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# 'unsafe-inline' on script-src is needed for the inline JSON-LD structured
# data block. If you add an analytics snippet from a third party, add its host
# to script-src here or it will be silently blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"

# Fingerprint-free assets: cache hard, but let HTML revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Legacy/mistyped paths people will inevitably try.
[[redirects]]
  from = "/pricing"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/wardrobe-organiser-dubai"
  to = "/services/"
  status = 301
